# stapeln.toml — layer-based container build for feedback-o-tron.

[metadata]
name = "feedback-o-tron"
version = "1.0.0"
description = "Feedback and bug-report submission for people and AI agents"
author = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"
license = "MPL-2.0"
registry = "ghcr.io/hyperpolymath"

[build]
containerfile = "packaging/Containerfile"
context = "."
runtime = "podman"

[layers.base]
description = "Chainguard Wolfi minimal base"
from = "cgr.dev/chainguard/wolfi-base@sha256:9a8d954d8f03a21bcf2be73d4628f0ad26d35c3275469925de63a34eebd58f13"
cache = true
verify = true

[layers.toolchain]
description = "Elixir and Erlang build tools"
extends = "base"
packages = ["elixir", "erlang", "git", "build-base"]
cache = true

[layers.build]
description = "OTP release build"
extends = "toolchain"
commands = [
    "cd elixir-mcp && mix local.hex --force && mix local.rebar --force",
    "cd elixir-mcp && MIX_ENV=prod mix deps.get --only prod",
    "cd elixir-mcp && MIX_ENV=prod mix release",
]

[layers.runtime]
description = "Release plus its shared libraries; ERTS is bundled"
from = "cgr.dev/chainguard/wolfi-base@sha256:9a8d954d8f03a21bcf2be73d4628f0ad26d35c3275469925de63a34eebd58f13"
packages = ["ca-certificates", "ncurses", "openssl", "libstdc++"]
copy-from = [
    { layer = "build", src = "/build/elixir-mcp/_build/prod/rel/feedback_a_tron/", dst = "/home/feedback/release/" },
]
entrypoint = ["/home/feedback/release/bin/feedback_a_tron", "start"]
user = "nonroot"

[security]
non-root = true
read-only-root = false
no-new-privileges = true
cap-drop = ["ALL"]
seccomp-profile = "default"

[security.signing]
algorithm = "ML-DSA-87"
provider = "cerro-torre"

[security.sbom]
format = "spdx-json"
output = "sbom.spdx.json"
include-deps = true

[verify]
vordr = true
svalinn = true
scan-on-build = true
fail-on = ["critical", "high"]

[targets.development]
description = "Full development environment"
layers = ["base", "toolchain", "build"]
env = { LOG_LEVEL = "debug" }

# The production target opens the doors it is deployed to serve. It used to
# declare only LOG_LEVEL, which meant a deploy of this target started a
# release with every door shut: nothing listening, and nothing saying so.
#
# The port is 7722, the engine's own intake port — deliberately not an
# 8080-class port.
#
# The bind stays on loopback on purpose. The HTTP intake carries no
# authentication of its own; it is a loopback wire for a cartridge or a
# sidecar in the same network namespace. To reach it from outside the
# container, put an authenticating proxy in front of it and forward to it —
# do not publish this port, and do not widen the bind to make wiring easier.
[targets.production]
description = "Production deployment: the intake door open on the loopback intake port"
layers = ["runtime"]
env = { LOG_LEVEL = "info", FEEDBACK_O_TRON_HTTP = "1", FEEDBACK_O_TRON_HTTP_PORT = "7722", FEEDBACK_O_TRON_HTTP_BIND = "127.0.0.1" }

[targets.test]
description = "Test environment"
layers = ["base", "toolchain", "build"]
env = { LOG_LEVEL = "debug" }
