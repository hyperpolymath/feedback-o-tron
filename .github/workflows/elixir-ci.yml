name: Elixir CI
on:
  push:
    branches: [main]
    paths:
      - 'elixir-mcp/**'
      - '.github/workflows/elixir-ci.yml'
  # No pull_request paths-filter: Dialyzer is a REQUIRED status check, so it must
  # report on every PR (a path-filtered required check deadlocks PRs that don't
  # touch its paths). The "Detect relevant changes" step gates the heavy work; the
  # non-required test matrix is gated the same way so it doesn't run on every PR.
  pull_request:
    branches: [main]
  # Manual runs: `gh workflow run elixir-ci.yml --ref <branch>`. Without this
  # the only way to measure a branch is to open a PR and wait for the event.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # change-detector reads the PR's file list
    defaults:
      run:
        working-directory: elixir-mcp
    strategy:
      fail-fast: false
      # The OTP floor is 27 (issue #97), and it is measured, not assumed: on
      # 2026-09-19 the OTP 26 cells (Elixir 1.15/1.16/1.17) all failed with
      # `function parse/1 undefined` while this same commit's OTP 27 cell
      # passed — cowlib 2.20, which cowboy requires, does not build on OTP
      # 26. The toolchain this repo pins (mise.toml: erlang 27.0 /
      # elixir 1.19.5-otp-27) is OTP 27. Every Elixir version named here is a
      # cell that has actually been run, so the documented floor is the floor
      # that builds.
      matrix:
        elixir: ['1.17', '1.18', '1.19']
        otp: ['27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect relevant changes
        id: detect
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PATTERN='^elixir-mcp/'
          # Fail-safe detector (estate required-gate convention): default to
          # running the suite; skip ONLY when a successful diff against the
          # base tip shows nothing relevant. Uses git (two-dot tree diff, so
          # shallow checkouts work) instead of `gh api`, whose non-JSON error
          # responses hard-failed this step (#51).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" \
               && FILES=$(git diff --name-only FETCH_HEAD HEAD); then
              if printf '%s\n' "$FILES" | grep -qE "$PATTERN"; then
                echo "relevant=true" >> "$GITHUB_OUTPUT"
              else
                echo "relevant=false" >> "$GITHUB_OUTPUT"; echo "No elixir-mcp changes — pass-through (required-check shim)."
              fi
            else
              echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "Detector could not compute the diff — failing safe (run=true)."
            fi
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Elixir
        if: steps.detect.outputs.relevant == 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Cache deps
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            elixir-mcp/deps
            elixir-mcp/_build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('elixir-mcp/mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-
      - name: Install dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: mix deps.get
      - name: Compile (warnings as errors)
        if: steps.detect.outputs.relevant == 'true'
        run: mix compile --warnings-as-errors
      - name: Check formatting
        if: steps.detect.outputs.relevant == 'true'
        run: mix format --check-formatted
      - name: Run tests
        if: steps.detect.outputs.relevant == 'true'
        # Teed, so a failure can be re-emitted as an annotation below. A red
        # cell whose log archive nobody can open is a red cell nobody fixes.
        run: |
          set -o pipefail
          mix test --trace 2>&1 | tee test-output.txt
      - name: Relay the failure to the Checks tab
        if: failure() && steps.detect.outputs.relevant == 'true'
        run: |
          python3 - <<'PY'
          import re
          text = open("test-output.txt", errors="replace").read()
          blocks = re.findall(r"\n\s+\d+\) test.*?(?=\n\n\n|\Z)", text, re.S)
          detail = "\n".join(blocks) or text[-6000:]
          warnings = [l for l in text.splitlines() if l.strip().startswith("warning:")]
          msg = (detail + "\n--- warnings ---\n" + "\n".join(warnings[:40]))[:24000]
          print("::error::" + msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
      - name: Build the escript
        if: steps.detect.outputs.relevant == 'true'
        run: mix escript.build
      - name: Run the escript smoke tests
        if: steps.detect.outputs.relevant == 'true'
        run: mix test --only escript
      - name: Prove nothing is sent without a person's typed yes
        if: steps.detect.outputs.relevant == 'true'
        # --self-test also builds a mutant whose consent gate is defeated and
        # requires this check to fail against it. A harness that has never
        # been seen to fail is not evidence (#95 F3).
        run: scripts/consent_bypass_check.sh --self-test
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read   # change-detector reads the PR's file list
    defaults:
      run:
        working-directory: elixir-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect relevant changes
        id: detect
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          PATTERN='^elixir-mcp/'
          # Fail-safe detector (estate required-gate convention): default to
          # running the suite; skip ONLY when a successful diff against the
          # base tip shows nothing relevant. Uses git (two-dot tree diff, so
          # shallow checkouts work) instead of `gh api`, whose non-JSON error
          # responses hard-failed this step (#51).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" \
               && FILES=$(git diff --name-only FETCH_HEAD HEAD); then
              if printf '%s\n' "$FILES" | grep -qE "$PATTERN"; then
                echo "relevant=true" >> "$GITHUB_OUTPUT"
              else
                echo "relevant=false" >> "$GITHUB_OUTPUT"; echo "No elixir-mcp changes — pass-through (required-check shim)."
              fi
            else
              echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "Detector could not compute the diff — failing safe (run=true)."
            fi
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Elixir
        if: steps.detect.outputs.relevant == 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19'
          otp-version: '27'
      - name: Cache deps
        if: steps.detect.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            elixir-mcp/deps
            elixir-mcp/_build
          key: dialyzer-${{ hashFiles('elixir-mcp/mix.lock') }}
          restore-keys: |
            dialyzer-
      - name: Install dependencies
        if: steps.detect.outputs.relevant == 'true'
        run: mix deps.get
      - name: Run Dialyzer
        if: steps.detect.outputs.relevant == 'true'
        run: mix dialyzer
        continue-on-error: true
